<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>PLATE CLUB · promo</title>
<style>
:root{
  --ice:#8FD3FF; --ice2:#4AA8FF; --ice3:#D9F1FF; --acid:#C6FF3D; --gold:#FFD25E;
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#E2F3FF 16%,#A9DAFF 38%,#5FA9EE 56%,#245FB4 70%,#8FCBFF 84%,#F3FAFF 100%);
  --f:'Inter Display',Inter,system-ui,sans-serif; --fm:'DejaVu Sans Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#040507;font-family:var(--f);color:#fff}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 40%,#0d1726,#040507 70%)}
.rays{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.055) 0deg 5deg,transparent 5deg 13deg)}
.vig{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 45%,transparent 40%,rgba(0,0,0,.75))}
.layer{position:absolute;inset:0;display:grid;place-items:center}
.logo{width:760px;filter:drop-shadow(0 0 60px rgba(74,168,238,.7))}
.kicker{font-family:var(--fm);font-size:30px;letter-spacing:.34em;color:var(--ice);text-transform:uppercase}
.h1{font-size:92px;font-weight:800;line-height:1.02;letter-spacing:-.02em;text-align:center}
.h1 .cg{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:40px;font-weight:600;color:#9FB4CC;text-align:center;line-height:1.3}
.plate{position:relative;display:inline-flex;align-items:stretch;height:150px;border-radius:16px;overflow:hidden;
  background:linear-gradient(170deg,#fff,#eef1f4 60%,#e2e6ea);color:#0b0c0f;border:5px solid #d4d9df;box-shadow:0 26px 70px rgba(0,0,0,.65),inset 0 3px 0 #fff}
.plate .n{display:flex;align-items:center;padding:0 26px;font-family:var(--fm);font-weight:700;font-size:96px;letter-spacing:-.02em}
.plate .n em{font-style:normal;font-size:68px}
.plate .r{display:grid;place-items:center;padding:0 20px;border-left:5px solid #d4d9df}
.plate .r b{font-family:var(--fm);font-size:60px;line-height:1}
.plate .r i{font-style:normal;font-size:20px;letter-spacing:.14em;color:#555;font-weight:700}
.plate.by{background:linear-gradient(170deg,#fff,#f1f3f5)}
.tag{display:inline-block;padding:10px 26px;border-radius:999px;font-family:var(--fm);font-size:30px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.t-rare{background:rgba(168,124,255,.18);color:#c9a8ff;border:2px solid rgba(168,124,255,.5)}
.t-grail{background:rgba(255,210,94,.16);color:var(--gold);border:2px solid rgba(255,210,94,.55)}
.case{position:relative;width:430px;height:330px;border-radius:30px;
  background:linear-gradient(160deg,#dbeaf7 0%,#9dc4e8 34%,#2a4e7e 100%);
  box-shadow:0 40px 110px rgba(0,0,0,.7),inset 0 6px 0 rgba(255,255,255,.55)}
.case::before{content:"";position:absolute;left:0;right:0;top:32%;height:6px;background:rgba(0,0,0,.28);box-shadow:0 2px 0 rgba(255,255,255,.4)}
.case::after{content:"";position:absolute;left:50%;top:-54px;width:150px;height:56px;margin-left:-75px;border:14px solid #cfe4f7;border-bottom:0;border-radius:24px 24px 0 0}
.shard{position:absolute;border-radius:4px;background:linear-gradient(135deg,#eaf4ff,#8fc4ea 45%,#1f3f68);clip-path:polygon(12% 0,100% 18%,86% 100%,0 72%)}
.strip{position:absolute;left:0;right:0;height:300px;display:flex;align-items:center;gap:16px;will-change:transform}
.card{flex:0 0 300px;min-width:0;max-width:300px;overflow:hidden;height:300px;border-radius:24px;background:linear-gradient(180deg,#141b28,#0b1019);border:2px solid rgba(255,255,255,.08);
  display:grid;place-items:center;gap:14px;align-content:center;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.card .mini{transform:scale(.48);transform-origin:center;white-space:nowrap}
.card .cap{font-family:var(--fm);font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#7D8FA6}
.marker{position:absolute;left:50%;top:50%;width:6px;height:340px;margin:-170px 0 0 -3px;border-radius:4px;background:linear-gradient(180deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.win{box-shadow:0 0 0 3px var(--gold),0 0 70px rgba(255,210,94,.65)!important}
.mk{display:grid;gap:26px;width:860px}
.mkrow{display:flex;align-items:center;gap:26px;padding:26px 30px;border-radius:28px;background:rgba(12,17,26,.9);border:2px solid rgba(255,255,255,.07)}
.mkrow .who{font-family:var(--fm);font-size:28px;color:#7D8FA6;flex:1}
.mkrow .price{font-family:var(--fm);font-size:46px;font-weight:700;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.mkrow .mini{transform:scale(.5);transform-origin:left center;width:300px}
.cta{display:grid;gap:34px;justify-items:center}
.btn{padding:30px 72px;border-radius:999px;background:var(--chrome);color:#03132e;font-size:46px;font-weight:800;box-shadow:0 26px 70px rgba(74,168,238,.45),inset 0 3px 0 #fff}
.url{font-family:var(--fm);font-size:40px;color:var(--ice);letter-spacing:.02em}
.pillbar{display:inline-flex;align-items:center;gap:22px;padding:20px 40px 20px 26px;border-radius:999px;background:rgba(5,8,14,.72);
  border:2px solid rgba(143,211,255,.45);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 50px rgba(74,168,238,.3),inset 0 2px 0 rgba(255,255,255,.18)}
.pillbar img{height:64px;display:block;filter:drop-shadow(0 0 16px rgba(143,211,255,.55))}
.pillbar .u{font-family:var(--fm);font-weight:700;font-size:36px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(143,211,255,.5) 32%,transparent 66%);pointer-events:none}
.conf{position:absolute;border-radius:3px}
</style></head>
<body><div id="st"></div>
<script src="promo.js"></script>
</body></html>
