<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>PLATE CLUB · banner</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet" onerror="">
<style>
  :root{
    --ice:#8FD3FF; --ice2:#4AA8FF; --ice3:#D9F1FF; --acid:#C6FF3D; --ink:#040507;
    --chrome:linear-gradient(180deg,#FFFFFF 0%,#E2F3FF 16%,#A9DAFF 38%,#5FA9EE 56%,#245FB4 70%,#8FCBFF 84%,#F3FAFF 100%);
    --f:'Manrope','Inter Display',Inter,system-ui,sans-serif; --fn:'Unbounded','Inter Display',Inter,system-ui,sans-serif; --fm:'IBM Plex Mono','DejaVu Sans Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:var(--f)}
  body{display:grid;place-items:center}
  .stage{position:relative;width:1080px;height:1920px}
  .slot{position:absolute;left:0;right:0;display:grid;place-items:center}
  .slot.bottom{bottom:300px}
  .slot.top{top:220px}
  .slot.mid{top:50%;transform:translateY(-50%)}

  /* ---------- 1. chrome pill: logo + handle ---------- */
  .pill{display:inline-flex;align-items:center;gap:22px;padding:20px 40px 20px 26px;border-radius:999px;
    background:rgba(5,8,14,.72);backdrop-filter:blur(14px);
    border:2px solid rgba(143,211,255,.45);
    box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 50px rgba(74,168,238,.3),inset 0 2px 0 rgba(255,255,255,.18)}
  .pill img{height:68px;display:block;filter:drop-shadow(0 0 16px rgba(143,211,255,.55))}
  .pill .u{font-family:var(--fm);font-weight:700;font-size:40px;letter-spacing:.02em;
    background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- 2. plate strip ---------- */
  .plate{position:relative;display:inline-flex;align-items:stretch;height:132px;border-radius:14px;overflow:hidden;
    background:linear-gradient(170deg,#fff,#eef1f4 60%,#e2e6ea);color:#0b0c0f;
    border:4px solid #d4d9df;box-shadow:0 22px 60px rgba(0,0,0,.6),inset 0 3px 0 #fff}
  .plate .n{display:flex;align-items:center;gap:4px;padding:0 24px;font-family:var(--fm);font-weight:700;font-size:86px;letter-spacing:-.01em}
  .plate .n small{font-size:60px}
  .plate .r{display:grid;place-items:center;gap:2px;padding:0 18px;border-left:4px solid #d4d9df}
  .plate .r b{font-family:var(--fm);font-weight:700;font-size:54px;line-height:1}
  .plate .r i{font-style:normal;font-size:19px;letter-spacing:.14em;font-weight:700;color:#555}
  .plate .shine{position:absolute;inset:0;background:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.95) 48%,transparent 58%);
    transform:translateX(-120%);animation:sweep 2.6s ease-in-out infinite}
  @keyframes sweep{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}

  /* ---------- 3. CTA bar ---------- */
  .cta{display:inline-grid;grid-auto-flow:column;align-items:center;gap:26px;padding:22px 40px;border-radius:28px;
    background:linear-gradient(135deg,rgba(9,13,22,.9),rgba(20,32,54,.88));backdrop-filter:blur(12px);
    border:2px solid rgba(143,211,255,.4);box-shadow:0 20px 70px rgba(0,0,0,.6)}
  .cta .dot{width:18px;height:18px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 0 rgba(198,255,61,.65);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 22px rgba(198,255,61,0)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0)}}
  .cta .txt{display:grid;gap:4px}
  .cta .t1{font-family:var(--fn);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em;
    background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cta .t2{font-size:28px;font-weight:700;color:#9FB4CC;letter-spacing:.01em}

  /* ---------- 4. corner badge ---------- */
  .badge{position:absolute;right:56px;top:260px;display:grid;gap:10px;justify-items:center;padding:24px 26px;border-radius:30px;
    background:rgba(5,8,14,.74);backdrop-filter:blur(14px);border:2px solid rgba(143,211,255,.4);box-shadow:0 16px 50px rgba(0,0,0,.6)}
  .badge img{width:120px;filter:drop-shadow(0 0 14px rgba(143,211,255,.6))}
  .badge span{font-family:var(--fm);font-size:24px;font-weight:700;color:var(--ice3)}

  /* ---------- 5. lower third ---------- */
  .lt{display:flex;align-items:center;gap:28px;padding:26px 44px;border-radius:0;width:1080px;
    background:linear-gradient(90deg,rgba(4,5,7,.92),rgba(10,20,36,.78) 60%,transparent)}
  .lt img{height:76px;filter:drop-shadow(0 0 14px rgba(143,211,255,.5))}
  .lt .v{width:3px;height:68px;background:linear-gradient(180deg,transparent,var(--ice),transparent)}
  .lt .txt{display:grid;gap:6px}
  .lt .a{font-family:var(--fn);font-weight:700;font-size:40px;color:#fff}
  .lt .b{font-family:var(--fm);font-size:28px;color:var(--ice)}

  .tick{display:inline-flex;align-items:center;gap:18px;padding:16px 32px;border-radius:999px;background:rgba(5,8,14,.78);backdrop-filter:blur(12px);
    border:2px solid rgba(198,255,61,.35);box-shadow:0 14px 44px rgba(0,0,0,.55)}
  .tick .dot{width:14px;height:14px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 0 rgba(198,255,61,.65);animation:pulse 1.8s infinite}
  .tick span{font-size:30px;font-weight:700;color:#DCE9F7}
  .tick b{font-family:var(--fm);font-size:30px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* reveal animation shared by all banners */
  .anim{opacity:0;transform:translateY(40px) scale(.94);animation:in .7s cubic-bezier(.16,1.1,.3,1) .15s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:360px;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(closest-side,rgba(74,168,238,.3),transparent 70%);filter:blur(10px)}

  /* ---------- PLAY NOW: big loud button ---------- */
  .play{position:relative;display:grid;justify-items:center;gap:26px}
  .play .go{position:relative;display:inline-flex;align-items:center;gap:30px;padding:44px 84px 44px 64px;border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,#E8FF8A 0%,#C6FF3D 45%,#8EDB00 100%);color:#061200;
    font-family:var(--fn);font-weight:800;font-size:96px;letter-spacing:-.01em;line-height:1;text-transform:uppercase;
    box-shadow:0 0 0 8px rgba(198,255,61,.25),0 30px 90px rgba(0,0,0,.6),0 0 120px rgba(198,255,61,.55),inset 0 5px 0 rgba(255,255,255,.7);
    animation:throb 1s ease-in-out infinite}
  .play .go .tri{width:0;height:0;border-left:70px solid #061200;border-top:42px solid transparent;border-bottom:42px solid transparent;margin-right:-6px}
  .play .go .sh{position:absolute;inset:0;background:linear-gradient(104deg,transparent 35%,rgba(255,255,255,.85) 47%,transparent 59%);transform:translateX(-130%);animation:sweep 1.5s ease-in-out infinite}
  .play .ring{position:absolute;left:50%;top:0;width:100%;height:180px;margin-left:-50%;border-radius:999px;border:6px solid rgba(198,255,61,.8);animation:ring 1.5s ease-out infinite}
  .play .sub{display:inline-flex;align-items:center;gap:18px;padding:14px 30px;border-radius:999px;background:rgba(5,8,14,.8);border:2px solid rgba(143,211,255,.45)}
  .play .sub img{height:52px}
  .play .sub b{font-family:var(--fm);font-size:34px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
  .play .arrow{font-size:90px;line-height:1;color:var(--acid);text-shadow:0 0 40px rgba(198,255,61,.8);animation:bob 1s ease-in-out infinite}
  @keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35,1.7);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
  .bonus{display:grid;justify-items:center;gap:18px;padding:40px 60px;border-radius:44px;background:rgba(5,8,14,.84);border:3px solid rgba(198,255,61,.6);
    box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 90px rgba(198,255,61,.3)}
  .bonus .k{font-family:var(--fm);font-weight:700;font-size:34px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice)}
  .bonus .big{font-family:var(--fn);font-weight:800;font-size:170px;line-height:.95;color:var(--acid);text-shadow:0 0 60px rgba(198,255,61,.6);animation:throb 1s ease-in-out infinite}
  .bonus .big small{font-size:70px}
  .bonus .s{font-size:40px;font-weight:800;color:#fff;text-align:center}
</style></head>
<body>
<div class="stage" id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const V = Q.get('v') || 'pill';
const LANG = Q.get('lang') === 'en' ? 'en' : 'ru';
const HANDLE = Q.get('h') || 'plate-club.netlify.app';
const TX = {
  collect: ['Коллекционные номера', 'Collectible plates'],
  start: ['100 PLT на старт', '100 PLT to start'],
  play: ['Играй бесплатно', 'Play for free'],
  rare: ['Лови редкий номер', 'Catch a rare plate'],
  playnow: ['Играть', 'Play now'],
  free: ['бесплатно · 100 PLT на старт', 'free · 100 PLT to start'],
  inviteK: ['Позови друга', 'Invite a friend'],
  inviteS: ['сразу за его регистрацию', 'the moment they sign up'],
};
const t_ = k => TX[k][LANG === 'en' ? 1 : 0];
const LOGO = '/brand/logo-chrome-900.png';
const T = {
  pill: `<div class="slot bottom"><div class="anim" style="position:relative"><div class="glow"></div>
      <div class="pill"><img src="${LOGO}" alt=""><span class="u">${HANDLE}</span></div></div></div>`,
  plate: `<div class="slot bottom"><div class="anim" style="display:grid;gap:22px;justify-items:center;position:relative">
      <div class="glow"></div>
      <div class="plate"><span class="n">А777АА<small></small></span><span class="r"><b>777</b><i>RUS</i></span><span class="shine"></span></div>
      <div class="pill" style="padding:14px 30px 14px 18px"><img src="${LOGO}" alt="" style="height:48px"><span class="u" style="font-size:30px">${HANDLE}</span></div></div></div>`,
  cta: `<div class="slot bottom"><div class="anim" style="position:relative"><div class="glow"></div>
      <div class="cta"><i class="dot"></i><span class="txt"><span class="t1">PLATE CLUB</span><span class="t2">${HANDLE}</span></span><img src="${LOGO}" alt="" style="height:60px"></div></div></div>`,
  badge: `<div class="badge anim"><img src="${LOGO}" alt=""><span>PLATE CLUB</span></div>`,
  lower: `<div class="slot bottom" style="bottom:360px;justify-items:start"><div class="lt anim"><img src="${LOGO}" alt=""><span class="v"></span><span class="txt"><span class="a">${t_('collect')}</span><span class="b">${HANDLE}</span></span></div></div>`,
  start: `<div class="slot bottom"><div class="anim" style="position:relative"><div class="glow"></div>
      <div class="cta" style="padding:26px 44px"><img src="${LOGO}" alt="" style="height:64px"><span class="txt"><span class="t1">${t_('start')}</span><span class="t2">${HANDLE}</span></span></div></div></div>`,
  play: `<div class="slot bottom"><div class="anim play"><span class="arrow">▼</span><div style="position:relative"><span class="ring"></span><div class="go"><span class="tri"></span>${t_('playnow')}<span class="sh"></span></div></div>
      <div class="sub"><img src="${LOGO}" alt=""><b>${HANDLE}</b></div></div></div>`,
  playtop: `<div class="slot top"><div class="anim play"><div style="position:relative"><span class="ring"></span><div class="go" style="font-size:80px;padding:36px 70px 36px 54px"><span class="tri" style="border-left-width:58px;border-top-width:35px;border-bottom-width:35px"></span>${t_('playnow')}<span class="sh"></span></div></div>
      <div class="sub"><b style="font-family:var(--f);font-weight:800;color:#C6FF3D;-webkit-text-fill-color:#C6FF3D">${t_('free')}</b></div></div></div>`,
  invite: `<div class="slot bottom"><div class="anim bonus"><span class="k">${t_('inviteK')}</span><span class="big">+1000<small> PLT</small></span><span class="s">${t_('inviteS')}</span>
      <div class="play" style="margin-top:6px"><div class="sub"><img src="${LOGO}" alt=""><b>${HANDLE}</b></div></div></div></div>`,
  ticker: `<div class="slot" style="top:300px"><div class="anim tick"><i class="dot"></i><span>${t_('play')}</span><b>${HANDLE}</b></div></div>`,
};
document.getElementById('stage').innerHTML = T[V] || T.pill;
</script>
</body></html>
